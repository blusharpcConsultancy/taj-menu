<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taj Menu</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      background-color: #2b1b17;
      font-family: sans-serif;
      height: 100%;
    }

    /* Vertical scroll container */
    .menu-container {
      height: 100vh;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
    }

    .slide {
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      scroll-snap-align: start;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    /* Page Counter */
    header {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
    }

    .page-counter {
      background: rgba(0,0,0,0.7);
      color: #d4af37;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      border: 1px solid #d4af37;
    }

    /* Call Button */
    .call-btn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #25D366;
      color: white;
      padding: 12px 35px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      z-index: 200;
    }
  </style>
</head>

<body>

<header>
  <div class="page-counter" id="counter">1 / 18</div>
</header>

<div class="menu-container" id="menu">
  <div class="slide"><img src="page1.jpg"></div>
  <div class="slide"><img src="page2.jpg"></div>
  <div class="slide"><img src="page3.jpg"></div>
  <div class="slide"><img src="page4.jpg"></div>
  <div class="slide"><img src="page5.jpg"></div>
  <div class="slide"><img src="page6.jpg"></div>
  <div class="slide"><img src="page7.jpg"></div>
  <div class="slide"><img src="page8.jpg"></div>
  <div class="slide"><img src="page9.jpg"></div>
  <div class="slide"><img src="page10.jpg"></div>
  <div class="slide"><img src="page11.jpg"></div>
  <div class="slide"><img src="page12.jpg"></div>
  <div class="slide"><img src="page13.jpg"></div>
  <div class="slide"><img src="page14.jpg"></div>
  <div class="slide"><img src="page15.jpg"></div>
  <div class="slide"><img src="page16.jpg"></div>
  <div class="slide"><img src="page17.jpg"></div>
  <div class="slide"><img src="page18.jpg"></div>
</div>

<a href="tel:1234567890" class="call-btn">Call Now</a>

<script>
  const menu = document.getElementById('menu');
  const counter = document.getElementById('counter');
  const totalSlides = 18;

  menu.addEventListener('scroll', () => {
    const index = Math.round(menu.scrollTop / window.innerHeight);
    counter.innerText = `${index + 1} / ${totalSlides}`;
  });
</script>

</body>
</html>
